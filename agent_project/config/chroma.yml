top_k_threshold: 3 #检索返回匹配的文档数量
# 综述论文的识别关键词（不区分大小写）
REVIEW_KEYWORDS : ["review", "综述", "survey", "overview"]
allow_knowledge_file_type: ["txt","pdf"]
md5_hex_store: "md5.txt" #保存已经处理过的文件
#spliter
chunk_size: 1000
chunk_overlap: 100
separators: ["\n\n","\n",",",".","?","!","，","。","？","！"," ",""]
max_split_char_number: 1000 #文本分割的阈值

